name: CI — Lint, Test & Security Scan

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Cancel in-progress runs for the same branch/PR
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"
  # Minimal env vars for test suite (no real API keys).
  # JWT_SECRET is CI-only. Must satisfy validateJwtSecret() in src/middleware/auth.js:
  # length ≥ 32 and a hex/base64/base64url pattern or ≥3 char classes.
  # FIELD_ENCRYPTION_KEYS is CI-only; 32-byte base64 test key.
  DATABASE_URL: postgresql://cushion:testpass@localhost:5432/cushion_gov_test
  JWT_SECRET: 0f3b8c2d4e6a1f9b7c5d2e8a4f1b6c9d3e7a2f8b5c1d9e6a4f2b8c7d3e1a9f5b
  FIELD_ENCRYPTION_KEYS: v1:YWJjZGVmZ2hpamtsbW5vcHFyc3R1dnd4eXowMTIzNDU=
  ANTHROPIC_API_KEY: sk-ant-test-placeholder
  LOG_LEVEL: error

jobs:
  lint:
    name: ESLint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run lint

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: cushion_gov_test
          POSTGRES_USER: cushion
          POSTGRES_PASSWORD: testpass
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cushion -d cushion_gov_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npx vitest run --reporter=default
        env:
          NODE_ENV: test

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      # npm audit — fail on high/critical vulnerabilities
      - run: npm audit --audit-level=high
      # Check for known vulnerable patterns in source
      - run: npm run lint

  typecheck:
    name: TypeScript Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx tsc --noEmit --project tsconfig.check.json
